name: Check formatting

on:
  push:
  pull_request:

jobs:
  astyle-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install AStyle
        run: |
          sudo apt-get update
          sudo apt-get install -y astyle
      - name: Run AStyle and fail on changes
        run: |
          # Run AStyle recursively on the PropaneScale folder (formats supported source files)
          astyle --options=.astylerc -r PropaneScale
          # Print any changed files and fail if AStyle modified the tree
          git --no-pager diff --name-only || true
          git diff --exit-code || (echo "AStyle formatting violations detected. Run 'astyle --options=.astylerc -r PropaneScale' locally and commit the results." && exit 1)